<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b55">
  <title>Create your DAVIMART password</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f3f6fb;color:#17243a;font-family:Arial,sans-serif}
    .card{width:min(100%,440px);background:#fff;border:1px solid #e3eaf3;border-radius:20px;padding:28px;box-shadow:0 16px 45px #102b5518}
    .brand{font-weight:900;color:#102b55;font-size:22px;letter-spacing:-.5px}.brand span{color:#d7a638}
    h1{font-size:25px;color:#102b55;margin:26px 0 8px}p{color:#637187;line-height:1.6;font-size:14px}
    label{display:block;font-weight:700;color:#243754;font-size:13px;margin:16px 0 7px}
    input{width:100%;padding:14px;border:1px solid #d5deea;border-radius:10px;font-size:16px}
    input:focus{outline:2px solid #d9ad48;border-color:#d9ad48}
    button,.link{display:block;width:100%;border:0;border-radius:10px;padding:14px;text-align:center;font-weight:700;text-decoration:none;cursor:pointer}
    button{margin-top:20px;background:#102b55;color:#fff;font-size:15px}button:disabled{opacity:.6;cursor:wait}
    .link{margin-top:10px;background:#f0f4fa;color:#102b55}
    #status{min-height:24px;margin-top:14px;font-weight:600}
    .small{font-size:12px;color:#7a8798}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">DAVI<span>MART</span></div>
    <h1 id="pageTitle">Create your DAVIMART password</h1>
    <p>Your Google account is connected. Create a password so you can also sign in with your email and password. Your Google sign-in will continue working.</p>
    <p id="account" class="small">Checking your secure sign-in…</p>
    <form id="passwordForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Enter it again" required>
      <button id="saveButton" type="submit">Save password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="link" href="/">Continue to DAVIMART</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient(
      "https://vaghptbqfjvfhjdhpxrz.supabase.co",
      "sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p"
    );
    const form = document.getElementById("passwordForm");
    const status = document.getElementById("status");
    async function init() {
      const { data: { session }, error } = await db.auth.getSession();
      if (error || !session?.user) {
        document.getElementById("account").textContent = "No active Google sign-in was found.";
        status.textContent = "Please return to DAVIMART and choose Sign up with Google again.";
        return;
      }
      document.getElementById("account").textContent = "Account: " + (session.user.email || "Google account");
      if (session.user.user_metadata?.davimart_password_set === true) {
        status.textContent = "Your DAVIMART password is already set. Returning to your account…";
        location.replace("index.html");
        return;
      }
      form.hidden = false;
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      if (password.length < 8) { status.textContent = "Use at least 8 characters."; return; }
      if (password !== confirm) { status.textContent = "The passwords do not match."; return; }
      const button = document.getElementById("saveButton");
      button.disabled = true;
      status.textContent = "Saving your password securely…";
      const { error } = await db.auth.updateUser({
        password,
        data: { davimart_password_set: true }
      });
      button.disabled = false;
      if (error) { status.textContent = "Could not save password: " + error.message; return; }
      form.hidden = true;
      status.textContent = "Password created successfully. Your Google sign-in will continue working too.";
      document.getElementById("account").textContent = "Password set for " + (await db.auth.getUser()).data.user.email;
      location.replace("index.html");
    });
    init();
  </script>

<script src="assets/davimart-navigation.js" defer></script>
</body>
</html>
