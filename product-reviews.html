<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f50"><title>Ratings & Reviews | DAVIMART">
<style>
:root{--navy:#071f50;--gold:#d9a72e;--ink:#17233b;--muted:#68758b;--line:#e6eaf0}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,sans-serif;padding-bottom:78px}.top{background:var(--navy);color:#fff;padding:10px 4%;font-size:12px}header{background:#fff;padding:14px 4%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:900;color:var(--navy);text-decoration:none}.logo span{color:var(--gold)}header a:last-child{color:var(--navy);font-weight:700;text-decoration:none}main{max-width:850px;margin:22px auto;padding:0 15px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}h1{font-size:24px;margin:0 0 8px;color:var(--navy)}h2{font-size:18px;color:var(--navy)}.muted{color:var(--muted);font-size:14px;line-height:1.6}.summary{font-size:16px;font-weight:800;color:var(--navy);margin:14px 0}.review{padding:15px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}.review-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.stars{color:#e3a008;letter-spacing:1px}.review-date{display:block;color:#8993a4;font-size:12px;margin:5px 0 8px}.review-body{margin:0;color:#475467;line-height:1.6;white-space:pre-wrap}textarea{width:100%;padding:12px;border:1px solid #d7deea;border-radius:8px;font:inherit;resize:vertical}button{border:0;border-radius:8px;padding:12px 18px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.star-picker{display:flex;gap:6px;margin:10px 0}.star-picker button{padding:0;background:transparent;color:#cbd5e1;font-size:30px}.status{font-size:13px;color:var(--muted);margin-top:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:2px solid var(--gold);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.nav a{color:white;text-decoration:none;font-size:12px;font-weight:700}@media(min-width:701px){.nav{display:none}body{padding-bottom:0}}
</style><script src="assets/davimart-ai-sitewide.js" defer></script>
</head><body><div class="top">DAVIMART by DAVITECH — Fast Reliable Affordable</div><header><a class="logo" href="index.html">DAVI<span>MART</span></a><a id="backLink" href="index.html">← Back to product</a></header><main><section class="panel"><h1 id="productTitle">Ratings & Reviews</h1><p id="productMeta" class="muted">Customer feedback for this product</p><div id="summary" class="summary">Loading ratings…</div></section><section class="panel"><h2>Customer reviews</h2><div id="reviewList" class="muted">Loading reviews…</div></section><section class="panel"><h2>Write a review</h2><p class="muted">Sign in to share your experience. Reviews are linked to this product.</p><form id="reviewForm"><div id="starPicker" class="star-picker" role="group" aria-label="Choose a star rating"></div><textarea id="reviewText" rows="4" minlength="5" maxlength="2000" required placeholder="What did you think about this product?"></textarea><p id="formStatus" class="status" role="status"></p><button id="submitReview" type="submit">Submit review</button></form></section></main><nav class="nav"><a href="index.html">⌂ Home</a><a href="shop.html">Shop</a><a href="cart.html">🛒 Cart</a><a href="account.html">Account</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p"),id=new URLSearchParams(location.search).get("id"),$=x=>document.getElementById(x);let chosen=5,product=null,existing=null;
for(let n=1;n<=5;n++){const b=document.createElement("button");b.type="button";b.textContent="★";b.setAttribute("aria-label",n+" stars");b.onclick=()=>{chosen=n;paintStars()};$("starPicker").appendChild(b)}
function paintStars(){$("starPicker").querySelectorAll("button").forEach((b,i)=>{b.style.color=i<chosen?"#e3a008":"#cbd5e1";b.setAttribute("aria-pressed",String(i<chosen))})}paintStars();
async function load(){
 if(!id){$("summary").textContent="No product selected.";return;}
 const {data:item,error}=await db.from("listings").select("id,title,price,seller_id,status,listing_type").eq("id",id).eq("status","approved").eq("listing_type","product").maybeSingle();
 if(error||!item){$("summary").textContent="This product is unavailable.";return;}product=item;$("productTitle").textContent=(item.title||"Product")+" — Ratings & Reviews";$("productMeta").textContent="₦"+Number(item.price||0).toLocaleString("en-NG");$("backLink").href="product.html?id="+encodeURIComponent(id);
 await loadList();const {data:{user}}=await db.auth.getUser();
 if(!user){$("formStatus").textContent="Please sign in to submit a review.";$("submitReview").textContent="Sign in to review";$("submitReview").onclick=e=>{e.preventDefault();location.href="account.html"};return;}
 if(user.id===item.seller_id){$("reviewForm").hidden=true;$("formStatus").textContent="Sellers cannot review their own products.";return;}
 const {data:mine}=await db.from("listing_reviews").select("id,rating,review_text").eq("listing_id",id).eq("reviewer_id",user.id).maybeSingle();
 if(mine){existing=mine;$("reviewText").value=mine.review_text;chosen=mine.rating;paintStars();$("submitReview").textContent="Update review"}
}
async function loadList(){
 const {data,error}=await db.from("listing_reviews").select("id,reviewer_name,rating,review_text,created_at").eq("listing_id",id).order("created_at",{ascending:false}).limit(100);$("reviewList").replaceChildren();
 if(error){$("summary").textContent="Ratings are temporarily unavailable.";return;}
 if(!data?.length){$("summary").textContent="No reviews yet. Be the first to share your experience.";const p=document.createElement("p");p.className="muted";p.textContent="This product has not received a review yet.";$("reviewList").appendChild(p);return;}
 const avg=data.reduce((sum,x)=>sum+Number(x.rating),0)/data.length;$("summary").textContent="★ "+avg.toFixed(1)+" out of 5 · "+data.length+" review"+(data.length===1?"":"s");
 data.forEach(x=>{const a=document.createElement("article");a.className="review";const top=document.createElement("div");top.className="review-top";const name=document.createElement("strong");name.textContent=x.reviewer_name||"DAVIMART customer";const stars=document.createElement("span");stars.className="stars";stars.textContent="★".repeat(x.rating)+"☆".repeat(5-x.rating);top.append(name,stars);const date=document.createElement("small");date.className="review-date";date.textContent=new Date(x.created_at).toLocaleDateString("en-NG",{year:"numeric",month:"short",day:"numeric"});const body=document.createElement("p");body.className="review-body";body.textContent=x.review_text;a.append(top,date,body);$("reviewList").appendChild(a)});
}
$("reviewForm").addEventListener("submit",async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();if(!user){$("formStatus").textContent="Please sign in first.";return;}const text=$("reviewText").value.trim();if(text.length<5){$("formStatus").textContent="Please write at least 5 characters.";return;}if(user.id===product?.seller_id){$("formStatus").textContent="Sellers cannot review their own products.";return;}$("submitReview").disabled=true;$("formStatus").textContent="Saving review…";const {data:profile}=await db.from("profiles").select("full_name").eq("id",user.id).maybeSingle();const name=(profile?.full_name||user.user_metadata?.full_name||user.email?.split("@")[0]||"DAVIMART customer").slice(0,80);let result;if(existing){result=await db.from("listing_reviews").update({rating:chosen,review_text:text,reviewer_name:name,updated_at:new Date().toISOString()}).eq("id",existing.id).eq("reviewer_id",user.id)}else{result=await db.from("listing_reviews").insert({listing_id:id,reviewer_id:user.id,reviewer_name:name,rating:chosen,review_text:text})}$("submitReview").disabled=false;if(result.error){$("formStatus").textContent="Could not save your review. Please try again.";return;}$("formStatus").textContent="Your review has been saved. Thank you!";await loadList();});
load();
</script>
