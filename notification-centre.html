<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071f50"><title>Notifications | DAVIMART</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding-bottom:84px;background:#f4f6fa;color:#17243a;font-family:Arial,sans-serif}header{background:#071f50;color:#fff;padding:18px;font-size:21px;font-weight:800}header span{color:#ffc400}main{max-width:850px;margin:22px auto;padding:0 15px}.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px #071f5010}h1,h2{color:#102b55;margin-top:0}.muted,.status{color:#667085;font-size:14px;line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:7px;background:#102b55;color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#e8edf5;color:#102b55}button:disabled{opacity:.55}.notice{border:1px solid #e1e5eb;border-radius:10px;padding:14px;margin:10px 0;background:#fff}.notice.unread{border-color:#e4b449;background:#fffaf0}.notice strong{display:block;color:#102b55}.notice p{font-size:14px;line-height:1.5;color:#475467}.notice a{color:#102b55;font-weight:700}.meta{font-size:12px;color:#667085}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#071f50;border-top:2px solid #ffc400;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.nav a{flex:1;color:white;text-decoration:none;text-align:center;font-size:10px;font-weight:800;padding:5px}.nav span{display:block;font-size:20px;margin-bottom:4px}@media(min-width:701px){.nav{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<header>DAVIMART <span>Notifications</span></header>
<main>
<section class="panel"><a href="account.html">← Back to My Account</a><h1>Notification Centre</h1><p class="muted">Your account and marketplace updates, all in one place.</p><p id="status" class="status" aria-live="polite">Checking your sign-in…</p>
<div class="actions"><button type="button" class="secondary" id="refresh">Refresh</button><button type="button" id="markAll">Mark All as Read</button></div>
<div id="notificationList" aria-live="polite"><p class="status">Loading notifications…</p></div></section>
</main>
<nav class="nav"><a href="index.html"><span>⌂</span>Home</a><a href="shop.html"><span>▣</span>Shop</a><a href="services-marketplace.html"><span>🛠</span>Services</a><a href="real-estate.html"><span>⌂</span>Properties</a><a href="account.html"><span>👤</span>Account</a></nav>
<script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p");
const host=document.getElementById("notificationList"),status=document.getElementById("status"),markAll=document.getElementById("markAll");
async function loadNotifications(){
 host.textContent="Loading your notifications…";markAll.disabled=true;
 const {data:{user},error:userError}=await db.auth.getUser();
 if(userError||!user){status.textContent="Please sign in to view your notifications.";host.textContent="Sign in from My Account, then return here.";return;}
 status.textContent="Signed in as "+(user.email||"your DAVIMART account")+".";
 const {data:items,error}=await db.from("notifications").select("id,created_at,title,message,is_read,notification_type,action_url").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100);
 if(error){host.textContent="Could not load notifications: "+error.message;return;}
 const unread=(items||[]).filter(item=>!item.is_read).length;
 status.textContent=unread?unread+" unread notification"+(unread===1?"":"s")+".":"You're all caught up.";
 markAll.disabled=unread===0;
 if(!items?.length){host.textContent="You have no notifications yet. New marketplace updates will appear here.";return;}
 host.replaceChildren();
 items.forEach(item=>{
  const card=document.createElement("article");card.className="notice"+(item.is_read?"":" unread");
  const title=document.createElement("strong");title.textContent=item.title||"DAVIMART update";card.append(title);
  const message=document.createElement("p");message.textContent=item.message||"You have a new account update.";card.append(message);
  const meta=document.createElement("div");meta.className="meta";meta.textContent=(item.created_at?new Date(item.created_at).toLocaleString():"Date unavailable")+" · "+(item.is_read?"Read":"Unread");card.append(meta);
  if(item.action_url){try{const target=new URL(item.action_url,location.origin);if(target.origin===location.origin){const link=document.createElement("a");link.href=target.href;link.textContent="View update";link.style.display="inline-block";link.style.marginTop="10px";card.append(link);}}catch(_){}}
  if(!item.is_read){const button=document.createElement("button");button.type="button";button.className="secondary";button.style.marginTop="10px";button.textContent="Mark as Read";button.onclick=async()=>{button.disabled=true;const {error}=await db.from("notifications").update({is_read:true}).eq("id",item.id).eq("user_id",user.id);if(error){meta.textContent="Could not mark as read: "+error.message;button.disabled=false;return;}await loadNotifications();};card.append(button);}
  host.append(card);
 });
}
document.getElementById("refresh").addEventListener("click",loadNotifications);
markAll.addEventListener("click",async()=>{const {data:{user},error:userError}=await db.auth.getUser();if(userError||!user){status.textContent="Please sign in again.";return;}markAll.disabled=true;const {error}=await db.from("notifications").update({is_read:true}).eq("user_id",user.id).eq("is_read",false);if(error){status.textContent="Could not update notifications: "+error.message;markAll.disabled=false;return;}await loadNotifications();});
loadNotifications();
</script>
</body></html>
