<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>DAVIMART email verification</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fb;color:#17243a;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.card{background:#fff;padding:28px;border-radius:18px;max-width:420px;width:100%;box-shadow:0 12px 40px #102b5520}.brand{font-weight:900;color:#102b55;font-size:22px}.brand span{color:#d7a638}h1{color:#102b55;font-size:24px}p{line-height:1.5;color:#637187}input,button{width:100%;padding:14px;border-radius:9px;font-size:16px;box-sizing:border-box;margin-top:12px}input{text-align:center;letter-spacing:6px;border:1px solid #ccd6e4}button{border:0;background:#102b55;color:white;font-weight:bold}button:disabled{opacity:.6}.alt{background:#eef2f8;color:#102b55}#status{font-size:13px;min-height:22px}
</style></head><body><main class="card"><div class="brand">DAVI<span>MART</span></div><h1>Verify your email</h1><p>For your security, enter the verification code sent to your Google account email before continuing to DAVIMART.</p><p id="account">Checking Google sign-in…</p>
<form id="form" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Six-digit verification code" required><button id="verify" type="submit">Verify and continue</button></form>
<button id="resend" class="alt" type="button" hidden>Send a new code</button><p id="status" role="status" aria-live="polite"></p><button id="cancel" class="alt" type="button">Cancel and sign out</button></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p");
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const raw=params.get("next")||"/index.html",next=raw.startsWith("/")&&!raw.startsWith("//")?raw:"/index.html";
let email="",userId="";
async function sendCode(){const b=$("resend");b.disabled=true;$("status").textContent="Sending verification code…";const {error}=await db.auth.reauthenticate();b.disabled=false;if(error){$("status").textContent="Could not send code: "+error.message;return;} $("form").hidden=false;b.hidden=false;$("status").textContent="Code sent. Check your inbox and spam folder.";}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error||!session?.user){$("account").textContent="No active Google sign-in found. Return to DAVIMART and sign in with Google again.";return;}const u=session.user;const isGoogle=u.app_metadata?.provider==="google"||(Array.isArray(u.app_metadata?.providers)&&u.app_metadata.providers.includes("google"));if(!isGoogle){location.replace("/index.html");return;}email=u.email||"";userId=u.id;$("account").textContent="Code destination: "+email;await sendCode();}
$("form").addEventListener("submit",async e=>{e.preventDefault();const token=$("code").value.trim();if(!/^[0-9]{6}$/.test(token)){$("status").textContent="Enter the six-digit code.";return;} $("verify").disabled=true;$("status").textContent="Verifying your code…";sessionStorage.setItem("davimart_google_otp_verified",userId);const {error}=await db.auth.verifyOtp({email,token,type:"reauthentication"});$("verify").disabled=false;if(error){sessionStorage.removeItem("davimart_google_otp_verified");$("status").textContent="Verification failed: "+error.message;return;}const {data:{user}}=await db.auth.getUser();if(!user){sessionStorage.removeItem("davimart_google_otp_verified");$("status").textContent="Please sign in again.";return;}sessionStorage.setItem("davimart_google_otp_verified",user.id);$("status").textContent="Email verified. Continuing…";location.replace(next);});
$("resend").addEventListener("click",sendCode);$("cancel").addEventListener("click",async()=>{await db.auth.signOut();sessionStorage.removeItem("davimart_google_otp_verified");location.replace("/index.html");});init();
</script></body></html>
