<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f50"><title>Secure Checkout | DAVIMART</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243a;font-family:Arial,sans-serif}.top{background:#071f50;color:#fff;padding:15px 5%;font-weight:900}.top span{color:#ffc400}main{max-width:720px;margin:25px auto;padding:0 15px}.panel{background:#fff;border:1px solid #e4e9f1;border-radius:14px;padding:22px;box-shadow:0 3px 15px #071f500c}h1{color:#102b55;margin:0 0 8px}.muted{color:#667085;line-height:1.55;font-size:14px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:800;color:#102b55;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}.field textarea{min-height:95px;resize:vertical}.summary{background:#f7f9fc;padding:15px;border-radius:9px;margin:18px 0}.summary div{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.total{border-top:1px solid #dfe5ed;padding-top:12px;font-size:18px;font-weight:900;color:#102b55}button{width:100%;padding:15px;border:0;border-radius:9px;background:#ffc400;color:#071f50;font-size:15px;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{font-size:13px;color:#a33;line-height:1.5;margin-top:12px}.back{display:inline-block;margin-bottom:15px;color:#102b55;font-weight:700;text-decoration:none}</style></head>
<body><div class="top">DAVI<span>MART</span> · SECURE CHECKOUT</div><main><a class="back" href="cart.html">← Back to cart</a><section class="panel"><h1>Delivery details</h1><p class="muted">Confirm where your order should be delivered. You will be redirected to Paystack to complete payment securely.</p>
<div class="summary" id="summary">Loading cart…</div>
<form id="checkoutForm"><div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" required maxlength="100"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" required minlength="7" maxlength="30"></div><div class="field"><label for="address">Full delivery address</label><textarea id="address" autocomplete="street-address" required minlength="8" maxlength="500" placeholder="House number, street, area, city and state"></textarea></div><button id="pay" type="submit">Continue to Paystack</button><p class="muted">Payments are processed by Paystack. DAVIMART never asks for your card PIN or OTP.</p><p id="status" role="status"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p"),KEY="davimart_cart",$=id=>document.getElementById(id),money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});
function cart(){try{return JSON.parse(localStorage.getItem(KEY)||"[]").filter(x=>x&&x.id&&Number(x.quantity)>0)}catch(e){return[]}}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$("status").textContent="Please sign in to continue."; $("pay").disabled=true;setTimeout(()=>location.href="account.html",1200);return;}if(user.email)$("status").textContent="Signed in as "+user.email;const items=cart();if(!items.length){$("summary").textContent="Your cart is empty."; $("pay").disabled=true;return;}let total=0;const box=$("summary");box.replaceChildren();const heading=document.createElement("strong");heading.textContent="Order summary";box.appendChild(heading);items.forEach(x=>{const line=document.createElement("div"),name=document.createElement("span"),price=document.createElement("strong");const amount=(Number(x.price)||0)*Number(x.quantity);total+=amount;name.textContent=(x.title||"Product")+" × "+x.quantity;price.textContent=money(amount);line.append(name,price);box.appendChild(line)});const t=document.createElement("div");t.className="total";const l=document.createElement("span"),v=document.createElement("strong");l.textContent="Total";v.textContent=money(total);t.append(l,v);box.appendChild(t);if(user.email)$("name").value=user.user_metadata?.full_name||"";}
$("checkoutForm").addEventListener("submit",async e=>{e.preventDefault();const items=cart();if(!items.length){$("status").textContent="Your cart is empty.";return;}const {data:{user}}=await db.auth.getUser();if(!user){$("status").textContent="Please sign in again.";return;}const button=$("pay");button.disabled=true;button.textContent="Preparing secure payment…";$("status").textContent="";const {data,error}=await db.functions.invoke("paystack-checkout",{body:{items:items.map(x=>({id:x.id,quantity:Number(x.quantity)})),customer_name:$("name").value.trim(),customer_phone:$("phone").value.trim(),delivery_address:$("address").value.trim(),callback_url:location.origin+"/checkout.html"}});if(error||!data?.authorization_url){$("status").textContent=data?.error||error?.message||"Could not start payment. Please try again.";button.disabled=false;button.textContent="Continue to Paystack";return;}sessionStorage.setItem("davimart_pending_reference",data.reference);location.href=data.authorization_url;});
async function verifyReturn(){const params=new URLSearchParams(location.search),ref=params.get("reference")||params.get("trxref");if(!ref)return;history.replaceState({},document.title,location.pathname);$("pay").disabled=true;$("status").textContent="Verifying your payment securely…";const {data,error}=await db.functions.invoke("paystack-verify",{body:{reference:ref}});if(error||!data?.paid){$("status").textContent=data?.error||"Payment has not yet been confirmed. Check My Orders before trying again.";return;}localStorage.removeItem(KEY);sessionStorage.removeItem("davimart_pending_reference");$("summary").textContent="Payment successful! Your order has been recorded.";const link=document.createElement("a");link.href="orders.html";link.textContent="View your order";link.style.cssText="display:block;margin-top:18px;font-weight:800;color:#102b55";$("summary").appendChild(link);$("status").textContent="Thank you for shopping with DAVIMART.";}
(async()=>{await init();await verifyReturn()})();
</script></body></html>
