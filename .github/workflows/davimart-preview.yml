name: DAVIMART development preview checks

on:
  push:
    branches:
      - fix/davimart-preview-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davimart-development-preview-checks
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preview files
    runs-on: ubuntu-latest
    steps:
      - name: Check out this development branch
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          test -f index.html
          test -f account.html
          test -f admin.html

      - name: Check patch formatting
        run: git diff --check

      - name: Confirm preview branch
        run: |
          echo "Validated branch: $GITHUB_REF_NAME"
          echo "The connected Vercel integration is responsible for publishing the live preview."
