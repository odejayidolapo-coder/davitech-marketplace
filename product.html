<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product details | DAVIMART</title>
<meta name="theme-color" content="#071f50">
<style>
:root{--navy:#071f50;--gold:#d9a72e;--ink:#17233b;--muted:#68758b;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.top{background:var(--navy);color:#fff;padding:9px 4%;font-size:12px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 4%;display:flex;align-items:center;gap:20px;justify-content:space-between}
.logo{font-weight:900;font-size:25px;color:var(--navy);text-decoration:none;letter-spacing:-1px}.logo span{color:var(--gold)}
.back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;color:var(--navy);font-weight:700;text-decoration:none}
main{max-width:1180px;margin:22px auto;padding:0 16px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 16px}
.product-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.gallery{display:flex;align-items:center;justify-content:center;min-height:390px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.gallery{position:relative;flex-direction:column;gap:12px;overflow:hidden}.gallery-main{width:100%;min-height:320px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}.gallery-main img{width:100%;max-width:100%;max-height:470px;object-fit:contain}.gallery-thumbs{display:flex;gap:9px;width:100%;overflow-x:auto;padding:4px 2px}.gallery-thumbs button{flex:0 0 68px;width:68px;height:64px;padding:3px;border:2px solid transparent;border-radius:8px;background:#f4f6fa;cursor:pointer}.gallery-thumbs button[aria-current=true]{border-color:var(--gold)}.gallery-thumbs img{width:100%;height:100%;object-fit:cover;border-radius:5px}
h1{font-size:25px;line-height:1.3;margin:0 0 16px;color:#17233b}
.price{font-size:29px;font-weight:800;color:var(--navy);margin:14px 0 6px}
.meta{font-size:13px;color:var(--muted);line-height:1.7}
.rule{height:1px;background:var(--line);margin:18px 0}
h2{font-size:17px;color:var(--navy);margin:0 0 10px}
.description{line-height:1.7;color:#48566e;white-space:pre-wrap}
.info{background:#f7f9fc;border-radius:9px;padding:13px;margin-top:14px;font-size:13px;line-height:1.6;color:#536179}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.actions button{padding:14px 10px;border:0;border-radius:8px;font-weight:800;font-size:14px;cursor:not-allowed;opacity:.65}
.cart{background:var(--navy);color:#fff}.buy{background:var(--gold);color:#17233b}
.status{padding:35px;text-align:center;color:var(--muted);background:#fff;border-radius:12px}
@media(max-width:760px){header{padding:12px 16px}.product-layout{grid-template-columns:1fr;gap:12px}.panel{padding:17px}.gallery{min-height:300px;padding:12px}.gallery-main{min-height:260px}.gallery-main img{max-height:340px}h1{font-size:21px}.price{font-size:26px}.actions{grid-template-columns:1fr}}
.below-product{margin-top:18px;display:grid;gap:18px}
.section-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-heading h2{font-size:19px;margin:0}
.rating-empty{border:1px dashed #d7deea;background:#fafbfd;border-radius:10px;padding:18px;color:var(--muted);font-size:14px;line-height:1.6}
.related-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.related-card{display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:inherit;text-decoration:none;transition:box-shadow .15s,border-color .15s}
.related-card:hover{border-color:#c9d5e8;box-shadow:0 5px 18px #071f5014}
.related-card img{width:100%;height:145px;object-fit:contain;background:#f7f8fb;border-radius:7px}
.related-card .related-name{font-size:13px;line-height:1.4;min-height:36px;color:#28364d}
.related-card strong{font-size:16px;color:var(--navy)}
.related-card small{font-size:11px;color:var(--muted)}
.related-empty{color:var(--muted);font-size:14px;padding:10px 0}
@media(max-width:760px){.section-panel{padding:15px}.related-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.related-card img{height:125px}.related-card{padding:8px}}

body{padding-bottom:100px}
.product-buybar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid #e4e7ec;box-shadow:0 -3px 14px #10182818;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.product-buybar a,.product-buybar button{height:52px;min-width:52px;border-radius:7px;font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:0 12px;border:1px solid #e99a2a;font-size:15px;box-sizing:border-box}
.product-buybar .home-link,.product-buybar .contact-link{background:#fff;color:#e88918;font-size:21px}
.product-buybar .qty-control{display:flex;align-items:center;justify-content:center;gap:0;color:#111827;font-weight:900;flex:1;max-width:190px}
.product-buybar .qty-control button{background:#f28c18;color:#fff;border:0;width:48px;min-width:48px;height:52px;font-size:25px;padding:0;border-radius:5px}
.product-buybar .qty-control span{min-width:42px;text-align:center;font-size:18px}
.product-buybar .cart-link{background:#f28c18;color:#fff;border:0;flex:1;max-width:220px;font-size:14px}
@media(max-width:520px){body{padding-bottom:94px}.product-buybar{gap:6px;padding-left:8px;padding-right:8px}.product-buybar a,.product-buybar button{height:50px;min-width:42px;padding:0 8px;font-size:12px}.product-buybar .home-link,.product-buybar .contact-link{min-width:42px;font-size:19px}.product-buybar .qty-control{flex:0 0 auto;gap:0}.product-buybar .qty-control button{width:38px;min-width:38px;height:50px}.product-buybar .qty-control span{min-width:30px;font-size:16px}.product-buybar .cart-link{flex:1;max-width:none;font-size:12px}}
@media(min-width:761px){.product-buybar{padding-left:max(24px,calc((100vw - 1180px)/2));padding-right:max(24px,calc((100vw - 1180px)/2))}}
</style>
</head>
<body>
<div class="top">DAVIMART by DAVITECH — Fast Reliable Affordable</div>
<header><a class="logo" href="index.html">DAVI<span>MART</span></a><a class="back" href="index.html#products">← Back to shopping</a></header>
<main>
<p class="crumb"><a href="index.html" style="color:inherit">Home</a> &nbsp;›&nbsp; Products &nbsp;›&nbsp; Product details</p>
<div id="productRoot" class="status">Loading product details…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p");
const root=document.getElementById("productRoot");
const id=new URLSearchParams(location.search).get("id");
const money=value=>"₦"+Number(value||0).toLocaleString("en-NG");
function renderRelatedProducts(items, host) {
 host.innerHTML="";
 if(!items?.length){const empty=document.createElement("p");empty.className="related-empty";empty.textContent="No similar products are available yet. Check back soon.";host.appendChild(empty);return;}
 items.forEach(product=>{
  const link=document.createElement("a");link.className="related-card";link.href="product.html?id="+encodeURIComponent(product.id);
  if(product.image_url){const img=document.createElement("img");img.src=product.image_url;img.alt=product.title||"Product";img.loading="lazy";link.appendChild(img);}
  const name=document.createElement("span");name.className="related-name";name.textContent=product.title||"Product";
  const price=document.createElement("strong");price.textContent=money(product.price);
  const category=document.createElement("small");category.textContent=product.category||"General";
  link.append(name,price,category);host.appendChild(link);
 });
}
async function loadRelatedProducts(item) {
 const section=document.getElementById("relatedProducts");
 let matches=[];
 if(item.category){
  const sameCategory=await db.from("listings").select("id,title,price,category,location,image_url").eq("status","approved").eq("listing_type","product").eq("category",item.category).neq("id",item.id).order("created_at",{ascending:false}).limit(8);
  if(sameCategory.error){section.textContent="More products could not be loaded right now.";return;}
  matches=sameCategory.data||[];
 }
 if(matches.length<8){
  const others=await db.from("listings").select("id,title,price,category,location,image_url").eq("status","approved").eq("listing_type","product").neq("id",item.id).order("created_at",{ascending:false}).limit(12);
  if(others.error&&matches.length===0){section.textContent="More products could not be loaded right now.";return;}
  const seen=new Set(matches.map(product=>String(product.id)));
  for(const product of (others.data||[])){
   if(!seen.has(String(product.id))){matches.push(product);seen.add(String(product.id));}
   if(matches.length===8)break;
  }
 }
 renderRelatedProducts(matches.slice(0,8),section);
}
async function loadReviews(item){
 const summary=document.getElementById("reviewSummary");
 const form=document.getElementById("reviewForm");
 const list=document.getElementById("reviewList");
 const status=form.querySelector('[role="status"]');
 const {data:{user}}=await db.auth.getUser();
 let ownReview=null;
 if(user){
  if(user.id===item.seller_id){
   form.hidden=true;
   const note=document.createElement("p");note.textContent="Sellers cannot review their own listings.";note.style.cssText="color:#667085;font-size:13px";form.after(note);
  }else{
   const mine=await db.from("listing_reviews").select("id,rating,review_text").eq("listing_id",item.id).eq("reviewer_id",user.id).maybeSingle();
   if(!mine.error) ownReview=mine.data;
   if(ownReview){form.querySelector("h3").textContent="Edit your review";form.querySelector("button[type=submit]").textContent="Update review";form.querySelector("textarea").value=ownReview.review_text;}
   if(ownReview){const buttons=form.querySelectorAll('[aria-label$="star"],[aria-label$="stars"]');buttons.forEach((b,i)=>{b.style.color=i<ownReview.rating?"#e3a008":"#cbd5e1";b.setAttribute("aria-pressed",String(i<ownReview.rating));});form.dataset.reviewId=ownReview.id;form._selectedRating=ownReview.rating;}
  }
 }else{
  form.querySelector("p").textContent="Sign in to leave a rating and review.";
  const signIn=document.createElement("a");signIn.href="account.html";signIn.textContent="Sign in to review";signIn.style.cssText="display:inline-block;margin:0 0 12px;color:#174b91;font-weight:700";
  form.insertBefore(signIn,form.querySelector("div"));
 }
 let chosen=ownReview?.rating||5;
 const stars=form.querySelectorAll('[aria-label$="star"],[aria-label$="stars"]');
 stars.forEach((b,i)=>b.addEventListener("click",()=>{chosen=i+1;form._selectedRating=chosen;}));
 form.addEventListener("submit",async event=>{
  event.preventDefault();
  const {data:{user:activeUser}}=await db.auth.getUser();
  if(!activeUser){status.textContent="Please sign in before submitting a review.";return;}
  if(activeUser.id===item.seller_id){status.textContent="You cannot review your own listing.";return;}
  const textValue=form.querySelector("textarea").value.trim();
  if(textValue.length<5){status.textContent="Please write at least 5 characters.";return;}
  const rating=form._selectedRating||chosen||5;
  submitReview.disabled=true;submitReview.textContent="Saving…";status.textContent="";
  const {data:profile}=await db.from("profiles").select("full_name").eq("id",activeUser.id).maybeSingle();
  const reviewerName=(profile?.full_name||activeUser.user_metadata?.full_name||activeUser.email?.split("@")[0]||"DAVIMART customer").trim().slice(0,80);
  let result;
  if(form.dataset.reviewId){
   result=await db.from("listing_reviews").update({rating,review_text:textValue,reviewer_name:reviewerName,updated_at:new Date().toISOString()}).eq("id",form.dataset.reviewId).eq("reviewer_id",activeUser.id);
  }else{
   result=await db.from("listing_reviews").insert({listing_id:item.id,reviewer_id:activeUser.id,reviewer_name:reviewerName,rating,review_text:textValue});
  }
  submitReview.disabled=false;submitReview.textContent=form.dataset.reviewId?"Update review":"Submit review";
  if(result.error){status.textContent="We couldn't save your review. Please try again.";return;}
  status.textContent="Your review has been saved. Thank you!";
  await loadReviewsList(item.id,summary,list);
 });
 await loadReviewsList(item.id,summary,list);
}
async function loadReviewsList(listingId,summary,list){
 summary.textContent="Loading customer ratings…";list.innerHTML="";
 const {data:reviews,error}=await db.from("listing_reviews").select("id,reviewer_name,rating,review_text,created_at").eq("listing_id",listingId).order("created_at",{ascending:false}).limit(100);
 if(error){summary.textContent="Customer ratings are temporarily unavailable.";return;}
 if(!reviews?.length){summary.textContent="No reviews yet. Be the first to share your experience.";const empty=document.createElement("p");empty.textContent="This product has not received a review yet.";empty.style.cssText="color:#667085;font-size:14px";list.appendChild(empty);return;}
 const average=reviews.reduce((sum,r)=>sum+Number(r.rating),0)/reviews.length;
 summary.textContent="★ "+average.toFixed(1)+" out of 5 · "+reviews.length+" review"+(reviews.length===1?"":"s");
 reviews.forEach(review=>{
  const card=document.createElement("article");card.style.cssText="padding:15px 0;border-bottom:1px solid #e7ebf2";
  const top=document.createElement("div");top.style.cssText="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap";
  const name=document.createElement("strong");name.textContent=review.reviewer_name||"DAVIMART customer";name.style.color="#102b55";
  const stars=document.createElement("span");stars.textContent="★".repeat(review.rating)+"☆".repeat(5-review.rating);stars.style.cssText="color:#e3a008;letter-spacing:1px";
  top.append(name,stars);
  const date=document.createElement("small");date.textContent=new Date(review.created_at).toLocaleDateString("en-NG",{year:"numeric",month:"short",day:"numeric"});date.style.cssText="display:block;color:#8993a4;margin:5px 0 8px";
  const body=document.createElement("p");body.textContent=review.review_text;body.style.cssText="margin:0;color:#475467;line-height:1.6;white-space:pre-wrap";
  card.append(top,date,body);list.appendChild(card);
 });
}
async function loadProduct(){
 if(!id){root.textContent="No product was selected. Please return to shopping.";return;}
 const {data:item,error}=await db.from("listings").select("id,title,description,price,category,location,image_url,listing_details,seller_id").eq("id",id).eq("status","approved").eq("listing_type","product").maybeSingle();
 if(error||!item){root.textContent="This product is unavailable or could not be loaded. Please return to shopping.";return;}
 document.title=(item.title||"Product")+" | DAVIMART";
 root.className="product-layout";
 root.innerHTML="";
 const gallery=document.createElement("section");gallery.className="gallery";
 const galleryMain=document.createElement("div");galleryMain.className="gallery-main";
 const imageUrls=[...new Set([item.image_url,...(Array.isArray(item.listing_details?.gallery_urls)?item.listing_details.gallery_urls:[])].filter(Boolean))];
 let activeImage=0;const mainImage=document.createElement("img");mainImage.alt=item.title||"Product image";mainImage.src=imageUrls[0]||"";
 if(!imageUrls.length){mainImage.style.display="none";galleryMain.textContent="No product image available";}else galleryMain.appendChild(mainImage);
 gallery.appendChild(galleryMain);
 if(imageUrls.length>1){const thumbs=document.createElement("div");thumbs.className="gallery-thumbs";
 imageUrls.forEach((url,index)=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-label","View image "+(index+1));b.setAttribute("aria-current",String(index===0));const im=document.createElement("img");im.src=url;im.alt="";b.appendChild(im);b.addEventListener("click",()=>{activeImage=index;mainImage.src=url;thumbs.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-current",String(i===index)));});thumbs.appendChild(b);});gallery.appendChild(thumbs);
 let touchStart=0;galleryMain.addEventListener("touchstart",e=>touchStart=e.changedTouches[0].clientX,{passive:true});galleryMain.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>45){activeImage=(activeImage+(dx<0?1:imageUrls.length-1))%imageUrls.length;mainImage.src=imageUrls[activeImage];thumbs.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-current",String(i===activeImage)));}},{passive:true});}
 const panel=document.createElement("section");panel.className="panel";
 const title=document.createElement("h1");title.textContent=item.title||"Product";
 const price=document.createElement("div");price.className="price";price.textContent=money(item.price);
 const meta=document.createElement("div");meta.className="meta";meta.textContent=(item.category||"General")+" · "+(item.location||"Nigeria");
 const rule=document.createElement("div");rule.className="rule";
 const descTitle=document.createElement("h2");descTitle.textContent="Product description";
 const desc=document.createElement("div");desc.className="description";desc.textContent=item.description||"The seller has not provided a description yet.";
 const delivery=document.createElement("div");delivery.className="info";const details=item.listing_details||{};delivery.textContent=["Condition: "+(details.condition||"Not specified"),"Brand: "+(details.brand||"Not specified"),"Model / specs: "+(details.model_specs||"Not specified"),"Available quantity: "+(details.stock_quantity??"Contact seller"),"Delivery: "+(details.delivery||"Contact seller for delivery options"),"Returns / warranty: "+(details.returns_warranty||"Ask seller")].join("\n");delivery.style.whiteSpace="pre-line";
 const contact=document.createElement("button");contact.type="button";contact.textContent="Message Seller";contact.style.cssText="width:100%;padding:13px;margin-top:14px;border:1px solid #d9a72e;border-radius:8px;background:#fff8e8;color:#071f50;font-weight:800;cursor:pointer";contact.onclick=async()=>{const {data:{user}}=await db.auth.getUser();if(!user){alert("Please sign in to message the seller.");return;}if(user.id===item.seller_id){alert("You cannot message yourself.");return;}location.href="messages.html?seller_id="+encodeURIComponent(item.seller_id)+"&listing_id="+encodeURIComponent(item.id)+"&title="+encodeURIComponent(item.title||"Marketplace item");};
 const saveButton=document.createElement("button");
 saveButton.type="button";saveButton.textContent="♡ Save to Wishlist";
 saveButton.style.cssText="width:100%;padding:13px;margin-top:10px;border:1px solid #d9a72e;border-radius:8px;background:#fff;color:#071f50;font-weight:800;cursor:pointer";
 saveButton.onclick=async()=>{
  saveButton.disabled=true;saveButton.textContent="Saving…";
  const {data:{user},error:authError}=await db.auth.getUser();
  if(authError||!user){alert("Please sign in to save items to your wishlist.");saveButton.disabled=false;saveButton.textContent="♡ Save to Wishlist";return;}
  const {data:existing,error:lookupError}=await db.from("wishlist").select("id").eq("user_id",user.id).eq("item_type","product").eq("item_id",item.id).maybeSingle();
  if(lookupError){alert("We couldn't check your wishlist. Please try again.");saveButton.disabled=false;saveButton.textContent="♡ Save to Wishlist";return;}
  if(existing){saveButton.textContent="✓ Saved to Wishlist";saveButton.disabled=false;return;}
  const {error:saveError}=await db.from("wishlist").insert({user_id:user.id,item_type:"product",item_id:item.id});
  if(saveError){alert("We couldn't save this item. Please try again.");saveButton.disabled=false;saveButton.textContent="♡ Save to Wishlist";return;}
  saveButton.textContent="✓ Saved to Wishlist";saveButton.disabled=false;
 };
 panel.append(title,price,meta,rule,descTitle,desc,delivery,contact,saveButton);
 root.append(gallery,panel);

 // Jumia-style fixed purchase toolbar: all primary product actions stay at the bottom.
 const buybar=document.createElement("nav");buybar.className="product-buybar";buybar.setAttribute("aria-label","Product actions");
 const homeLink=document.createElement("a");homeLink.className="home-link";homeLink.href="index.html";homeLink.textContent="⌂";homeLink.setAttribute("aria-label","Home");
 const contactLink=document.createElement("a");contactLink.className="contact-link";contactLink.href="messages.html?seller_id="+encodeURIComponent(item.seller_id)+"&listing_id="+encodeURIComponent(item.id)+"&title="+encodeURIComponent(item.title||"Product");contactLink.textContent="☎";contactLink.setAttribute("aria-label","Contact seller");contactLink.title="Contact seller";
 const qty=document.createElement("div");qty.className="qty-control";const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","Decrease quantity");const qtyText=document.createElement("span");qtyText.textContent="1";const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","Increase quantity");let selectedQty=1;
 minus.addEventListener("click",()=>{selectedQty=Math.max(1,selectedQty-1);qtyText.textContent=String(selectedQty)});plus.addEventListener("click",()=>{selectedQty=Math.min(99,selectedQty+1);qtyText.textContent=String(selectedQty)});
 const addCart=document.createElement("button");addCart.type="button";addCart.className="cart-link";addCart.textContent="🛒 Add to Cart";
 addCart.addEventListener("click",()=>{let items=[];try{items=JSON.parse(localStorage.getItem("davimart_cart")||"[]");if(!Array.isArray(items))items=[]}catch(e){items=[]}const existing=items.find(x=>x&&x.id===item.id);if(existing)existing.quantity=Math.min(99,Math.max(1,Number(existing.quantity)||1)+selectedQty);else items.push({id:item.id,title:item.title||"Product",price:Number(item.price)||0,image_url:item.image_url||"",quantity:selectedQty});localStorage.setItem("davimart_cart",JSON.stringify(items));window.dispatchEvent(new Event("davimart-cart-updated"));addCart.textContent="✓ Added · View Cart";addCart.onclick=()=>location.href="cart.html";});
 qty.append(minus,qtyText,plus);buybar.append(homeLink,contactLink,qty,addCart);document.body.appendChild(buybar);


 const reviewPanel=document.createElement("section");reviewPanel.className="review-link-panel";const reviewCopy=document.createElement("div");const reviewHeading=document.createElement("h2");reviewHeading.textContent="Ratings & Reviews";const reviewText=document.createElement("p");reviewText.className="meta";reviewText.textContent="Read customer feedback and share your experience on this product's review page.";reviewCopy.append(reviewHeading,reviewText);const reviewAnchor=document.createElement("a");reviewAnchor.href="product-reviews.html?id="+encodeURIComponent(item.id);reviewAnchor.textContent="View ratings & reviews";reviewPanel.append(reviewCopy,reviewAnchor);root.after(reviewPanel);
 const related=document.createElement("section");related.className="section-panel";
 related.id="moreProductsSection";
 const relatedHeading=document.createElement("div");relatedHeading.className="section-heading";
 const relatedTitle=document.createElement("h2");relatedTitle.textContent="More products you may like";
 relatedHeading.appendChild(relatedTitle);
 const relatedGrid=document.createElement("div");relatedGrid.id="relatedProducts";relatedGrid.className="related-grid";
 related.append(relatedHeading,relatedGrid);
 document.querySelector("main").appendChild(related);
 loadRelatedProducts(item);
}
loadProduct();
</script>
