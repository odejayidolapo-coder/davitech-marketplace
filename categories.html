
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | DAVIMART by DAVITECH</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-bottom: 85px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17243a;
    }
    header {
      background: #102b55;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }
    header span { color: #e4b449; }
    .intro {
      background: white;
      padding: 25px 16px;
      text-align: center;
    }
    .intro h1 { color: #102b55; }
    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 18px;
    }
    .category {
      background: white;
      padding: 24px 10px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: #102b55;
      border: 1px solid #e5e8ee;
      box-shadow: 0 2px 8px #0000000c;
    }
    .category span {
      display: block;
      font-size: 38px;
      margin-bottom: 12px;
    }
    .category b { font-size: 14px; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      background: white;
      border-top: 2px solid #e4b449;
      z-index: 10;
    }
    .bottom-nav a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #102b55;
      font-size: 11px;
      font-weight: 900;
      padding: 10px 2px;
    }
    .bottom-nav span {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: white;
      display: grid;
      place-items: center;
      z-index: 100;
      color: #102b55;
      font-weight: bold;
    }
    @media (min-width: 700px) {
      .categories { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
<style>
/* Consistent, mobile-safe DAVIMART marketplace navigation */
.dm-bottom-nav,.bottom-nav{display:none}
@media(max-width:700px){
 .dm-bottom-nav,.bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:3000;justify-content:space-around;align-items:stretch;gap:0;padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#071f50;border-top:2px solid #ffc400;box-shadow:0 -3px 14px #071f5022}
 .dm-bottom-nav a,.bottom-nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 1px;color:#fff;font-size:10px;font-weight:800;text-decoration:none;text-align:center;white-space:nowrap}
 .dm-bottom-nav a span,.bottom-nav a span{font-size:20px;line-height:1.1}
 .dm-bottom-nav a[aria-current="page"],.bottom-nav a[aria-current="page"]{color:#ffc400}
 .dm-bottom-nav a:focus-visible,.bottom-nav a:focus-visible{outline:2px solid #ffc400;outline-offset:-2px;border-radius:7px}
 body{padding-bottom:calc(82px + env(safe-area-inset-bottom))!important}
}
@media(min-width:701px){.dm-bottom-nav,.bottom-nav{display:none!important}}
</style>
</head>
<body>

<div id="loader">Loading DAVIMART Categories...</div>

<header>DAVIMART <span>by DAVITECH</span></header>

<section class="intro">
  <h1>Shop by Category</h1>
  <p>Explore products from different categories on DAVIMART.</p>
</section>

<main class="categories">
  <a class="category" href="shop.html?category=Phones">
    <span>📱</span><b>Phones & Accessories</b>
  </a>
  <a class="category" href="shop.html?category=Computing">
    <span>💻</span><b>Computing</b>
  </a>
  <a class="category" href="shop.html?category=Electronics">
    <span>📺</span><b>Electronics</b>
  </a>
  <a class="category" href="shop.html?category=Home">
    <span>🏠</span><b>Home & Living</b>
  </a>
  <a class="category" href="shop.html?category=Fashion">
    <span>👗</span><b>Fashion</b>
  </a>
  <a class="category" href="shop.html?category=Beauty">
    <span>💄</span><b>Beauty</b>
  </a>
  <a class="category" href="shop.html?category=Other">
    <span>🛍️</span><b>Other Products</b>
  </a>
  <a class="category" href="real-estate.html">
    <span>🏡</span><b>Real Estate</b>
  </a>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
<a href="index.html"><span>⌂</span>Home</a>
<a href="shop.html" aria-current="page"><span>▦</span>Shop</a>
<a href="services-marketplace.html"><span>▣</span>Services</a>
<a href="real-estate.html"><span>⌂</span>Properties</a>
<a href="account.html"><span>♙</span>Account</a>
</nav>

<script>
window.addEventListener("load", function() {
  document.getElementById("loader").style.display = "none";
});
</script>

</body>
  </html>
