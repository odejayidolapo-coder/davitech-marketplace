<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071f50">
<title>My Cart | DAVIMART</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243a;font-family:Arial,Helvetica,sans-serif;padding-bottom:75px}
header{background:#071f50;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #ffc400}
header a{color:#fff;text-decoration:none;font-size:13px}header strong{font-size:21px}header strong span{color:#ffc400}
main{max-width:1000px;margin:26px auto;padding:0 16px}h1{color:#102b55;margin:0 0 8px}.muted{color:#667085;line-height:1.5}
.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:22px}
.items,.summary{background:#fff;border:1px solid #e5eaf2;border-radius:13px;padding:16px}
.cart-item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f5}
.cart-item:last-child{border-bottom:0}.cart-item img,.placeholder{width:92px;height:92px;object-fit:cover;border-radius:9px;background:#eef2f7}
.placeholder{display:grid;place-items:center;font-size:30px}.cart-item h2{font-size:15px;color:#102b55;margin:0 0 7px}.price{font-weight:800;color:#174b91;margin:0 0 10px}
.qty{display:flex;align-items:center;gap:9px}.qty button{border:0;background:#0b56c5;color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;transition:background .25s ease,opacity .25s ease}.qty button:disabled{background:#8b98aa;opacity:.45;cursor:not-allowed}.remove{border:1px solid #dbe2ec;background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer}.qty span{font-weight:800;min-width:16px;text-align:center}.remove{color:#a32626;border-color:#f1d3d3;margin-top:7px;font-size:12px}
.line-total{font-weight:800;color:#102b55;white-space:nowrap}.summary h2{margin:0 0 16px;color:#102b55;font-size:18px}.summary-row{display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:#536078}.grand{border-top:1px solid #e5eaf2;padding-top:14px;font-size:18px;font-weight:900;color:#102b55}
.checkout{width:100%;border:0;border-radius:9px;padding:14px;background:#ffc400;color:#071f50;font-size:14px;font-weight:900;margin-top:14px;cursor:pointer}.checkout:disabled{opacity:.6;cursor:not-allowed}
.notice{font-size:12px;color:#778399;line-height:1.5;margin-top:12px}
.empty{text-align:center;padding:36px 15px}.empty h2{color:#102b55}.empty a{display:inline-block;margin-top:10px;background:#102b55;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#071f50;border-top:2px solid #ffc400;padding:9px 3px calc(9px + env(safe-area-inset-bottom))}
.nav a{color:#fff;text-decoration:none;text-align:center;font-size:10px}.nav span{display:block;font-size:19px;margin-bottom:3px}
@media(max-width:700px){.cart-layout{grid-template-columns:1fr}.cart-item{grid-template-columns:74px minmax(0,1fr)}.cart-item img,.placeholder{width:74px;height:74px}.line-total{grid-column:2}.summary{order:-1}}
@media(min-width:701px){.nav{display:none}body{padding-bottom:0}}
</style>
<script src="assets/davimart-ai-sitewide.js" defer></script>
</head>
<body>
<header><strong>DAVIMART <span>My Cart</span></strong><a href="index.html">← Continue shopping</a></header>
<main>
<h1>Shopping Cart</h1><p class="muted">Review your selected products before checkout.</p>
<div id="cartRoot" class="cart-layout"><div class="items">Loading your cart…</div></div>
</main>
<nav class="nav"><a href="index.html"><span>⌂</span>Home</a><a href="shop.html"><span>▦</span>Shop</a><a href="cart.html"><span>🛒</span>Cart</a><a href="account.html"><span>👤</span>Account</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://vaghptbqfjvfhjdhpxrz.supabase.co","sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p");
const KEY="davimart_cart";
const root=document.getElementById("cartRoot");
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(Number(n)||0);
function readCart(){try{const data=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(data)?data:[]}catch(e){return[]}}
function saveCart(items){localStorage.setItem(KEY,JSON.stringify(items));window.dispatchEvent(new Event("davimart-cart-updated"))}
async function render(){
 const items=readCart().filter(x=>x&&x.id);
 if(items.length){
  const result=await db.from("listings").select("id,listing_type,status,listing_details").in("id",items.map(x=>x.id));
  if(!result.error&&Array.isArray(result.data)){
   const byId=new Map(result.data.map(x=>[x.id,x]));
   items.forEach(item=>{const listing=byId.get(item.id);if(!listing||listing.status!=="approved"||listing.listing_type!=="product"){item.stock_quantity=0;item.unavailable=true;}else{item.stock_quantity=Math.max(0,Math.floor(Number(listing.listing_details?.stock_quantity??1)||0));item.unavailable=false;}item.quantity=Math.min(item.stock_quantity,Math.max(0,Number(item.quantity)||0));});
   saveCart(items);
  }
 }
 if(!items.length){root.innerHTML='<section class="items empty"><div style="font-size:44px">🛒</div><h2>Your cart is empty</h2><p class="muted">You have not added any products yet.</p><a href="index.html">Explore products</a></section>';return}
 const count=items.reduce((n,x)=>n+Math.max(0,Number(x.quantity)||0),0);
 const total=items.reduce((n,x)=>n+(Number(x.price)||0)*Math.max(0,Number(x.quantity)||0),0);
 const list=document.createElement("section");list.className="items";
 items.forEach(item=>{
  const row=document.createElement("article");row.className="cart-item";
  if(item.image_url){const img=document.createElement("img");img.src=item.image_url;img.alt=item.title||"Product";img.onerror=()=>{const ph=document.createElement("div");ph.className="placeholder";ph.textContent="🛍️";img.replaceWith(ph)};row.appendChild(img)}
  else{const ph=document.createElement("div");ph.className="placeholder";ph.textContent="🛍️";row.appendChild(ph)}
  const details=document.createElement("div");const title=document.createElement("h2");title.textContent=item.title||"Product";
  const price=document.createElement("p");price.className="price";price.textContent=money(item.price);
  const qty=document.createElement("div");qty.className="qty";
  const stock=Math.max(0,Math.floor(Number(item.stock_quantity??1)||0));
  item.quantity=Math.min(stock,Math.max(0,Number(item.quantity)||0));
  const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","Decrease quantity");
  const number=document.createElement("span");number.textContent=item.quantity;minus.disabled=item.quantity<=1||stock<1;
  const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","Increase quantity");plus.disabled=item.quantity>=stock;
  minus.onclick=()=>change(item.id,-1);plus.onclick=()=>change(item.id,1);
  qty.append(minus,number,plus);
  const remove=document.createElement("button");remove.type="button";remove.className="remove";remove.textContent="Remove";remove.onclick=()=>removeItem(item.id);
  if(stock<1){const warning=document.createElement("p");warning.textContent=item.unavailable?"This product is no longer available.":"Out of stock";warning.style.color="#b42318";details.append(title,price,warning,qty,remove);}else details.append(title,price,qty,remove);row.appendChild(details);
  const line=document.createElement("div");line.className="line-total";line.textContent=money((Number(item.price)||0)*Math.max(1,Number(item.quantity)||1));row.appendChild(line);
  list.appendChild(row);
 });
 const summary=document.createElement("aside");summary.className="summary";
 const hasUnavailable=items.some(x=>x.unavailable||Number(x.stock_quantity)<1||Number(x.quantity)<1);
 summary.innerHTML='<h2>Order summary</h2><div class="summary-row"><span>Items ('+count+')</span><strong>'+money(total)+'</strong></div><div class="summary-row"><span>Delivery</span><span>Calculated later</span></div><div class="summary-row grand"><span>Total</span><span>'+money(total)+'</span></div><button class="checkout" type="button" id="checkoutButton" '+(hasUnavailable?'disabled':'')+'>Proceed to Checkout</button><p class="notice">Secure payment is handled by Paystack. Delivery fee will be confirmed separately by the seller.</p>';
 root.replaceChildren(list,summary);
 document.getElementById("checkoutButton").addEventListener("click",()=>location.href="checkout.html");
}
function change(id,delta){const items=readCart();const item=items.find(x=>x.id===id);if(!item)return;const stock=Math.max(0,Math.floor(Number(item.stock_quantity??1)||0));item.quantity=Math.max(0,Math.min(stock,(Number(item.quantity)||0)+delta));saveCart(items);render()}
function removeItem(id){saveCart(readCart().filter(x=>x.id!==id));render()}
window.addEventListener("storage",render);window.addEventListener("davimart-cart-updated",render);render();
</script>

<script src="assets/davimart-navigation.js" defer></script>
</body>
</html>
