<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071f50">
<title>My Wishlist | DAVIMART</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding-bottom:78px;background:#f4f6fa;color:#17243a;font-family:Arial,sans-serif}
header{background:#071f50;color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header strong{font-size:21px}header span{color:#ffc400}header a{color:#fff;text-decoration:none;font-size:13px}
main{max-width:1000px;margin:28px auto;padding:0 16px}.intro h1{color:#102b55;margin:0 0 7px}.intro p{color:#667085;line-height:1.5}
#status{padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;color:#526078;margin:18px 0;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}
.item{background:#fff;border:1px solid #e5eaf2;border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #102b550b}
.item img{width:100%;height:170px;object-fit:cover;background:#eef2f7}.item-body{padding:14px}
.item h2{font-size:16px;color:#102b55;margin:0 0 8px}.price{font-weight:800;color:#174b91;margin:0 0 8px}.meta{font-size:12px;color:#758198;margin-bottom:12px}
.actions{display:flex;gap:8px}.actions a,.actions button{flex:1;text-align:center;padding:10px 8px;border-radius:7px;font-weight:700;font-size:12px;text-decoration:none;border:0;cursor:pointer}
.view{background:#102b55;color:#fff}.remove{background:#fff0f0;color:#a32626}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:13px;padding:38px 20px;text-align:center}.empty h2{color:#102b55}.empty p{color:#667085;line-height:1.6}.empty a{display:inline-block;background:#102b55;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#071f50;border-top:2px solid #ffc400;display:flex;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}
.nav a{flex:1;color:#fff;text-decoration:none;text-align:center;font-size:10px;padding:5px}.nav span{display:block;font-size:19px;margin-bottom:3px}
@media(min-width:701px){.nav{display:none}body{padding-bottom:0}}
</style>
<script src="assets/davimart-ai-sitewide.js" defer></script>
</head>
<body>
<header><strong>DAVIMART <span>Wishlist</span></strong><a href="account.html">← My Account</a></header>
<main>
<section class="intro"><h1>My Wishlist</h1><p>Products, services and properties you have saved for later.</p></section>
<div id="status" role="status">Loading your saved items…</div>
<div id="wishlistGrid" class="grid"></div>
</main>
<nav class="nav"><a href="index.html"><span>⌂</span>Home</a><a href="shop.html"><span>▣</span>Shop</a><a href="account.html"><span>👤</span>Account</a><a href="messages.html"><span>✉</span>Inbox</a></nav>
<script>
const db = window.supabase.createClient(
  "https://vaghptbqfjvfhjdhpxrz.supabase.co",
  "sb_publishable_jhln20nV5QABwMl39RKv3w_wGy5x72p"
);
const statusBox=document.getElementById("status");
const grid=document.getElementById("wishlistGrid");
const money=value=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(Number(value||0));
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showEmpty(message){statusBox.hidden=true;grid.innerHTML='<div class="empty"><h2>Your wishlist is empty</h2><p>'+escapeHtml(message)+'</p><a href="index.html">Explore DAVIMART</a></div>';}
async function loadWishlist(){
  statusBox.hidden=false;statusBox.textContent="Loading your saved items…";grid.innerHTML="";
  const {data:{user},error:authError}=await db.auth.getUser();
  if(authError||!user){statusBox.hidden=true;grid.innerHTML='<div class="empty"><h2>Sign in to view your wishlist</h2><p>Your saved items are linked to your DAVIMART account.</p><a href="account.html">Go to My Account</a></div>';return;}
  const {data:saved,error}=await db.from("wishlist").select("id,item_type,item_id,created_at").eq("user_id",user.id).order("created_at",{ascending:false});
  if(error){statusBox.textContent="We couldn't load your wishlist. Please refresh and try again.";return;}
  if(!saved||saved.length===0){showEmpty("When you save an item, it will appear here.");return;}
  const ids=[...new Set(saved.map(row=>row.item_id))];
  const {data:listings,error:listError}=await db.from("listings").select("id,title,description,price,category,listing_type,location,image_url,status").in("id",ids);
  if(listError){statusBox.textContent="Your saved items were found, but listing details could not be loaded. Please try again.";return;}
  const byId=new Map((listings||[]).map(item=>[item.id,item]));
  const visible=saved.map(row=>({saved:row,item:byId.get(row.item_id)})).filter(entry=>entry.item && entry.item.status==="approved" && entry.item.listing_type===entry.saved.item_type);
  if(!visible.length){showEmpty("There are no currently available saved listings. You can explore DAVIMART for more.");return;}
  statusBox.hidden=true;
  grid.innerHTML=visible.map(({saved:row,item})=>{
    const image=item.image_url?'<img src="'+escapeHtml(item.image_url)+'" alt="'+escapeHtml(item.title)+'" loading="lazy">':'<div style="height:170px;display:grid;place-items:center;background:#eef2f7;font-size:44px">🛍️</div>';
    return '<article class="item" data-id="'+escapeHtml(row.id)+'">'+image+'<div class="item-body"><h2>'+escapeHtml(item.title)+'</h2><p class="price">'+money(item.price)+'</p><div class="meta">'+escapeHtml(item.listing_type)+' · '+escapeHtml(item.category||"General")+(item.location?' · '+escapeHtml(item.location):'')+'</div><div class="actions"><a class="view" href="product.html?id='+encodeURIComponent(item.id)+'">View item</a><button class="remove" type="button" data-remove="'+escapeHtml(row.id)+'">Remove</button></div></div></article>';
  }).join("");
}
grid.addEventListener("click",async event=>{
  const button=event.target.closest("[data-remove]");if(!button)return;
  const id=button.dataset.remove;button.disabled=true;button.textContent="Removing…";
  const {data:{user}}=await db.auth.getUser();
  if(!user){button.disabled=false;button.textContent="Remove";return;}
  const {error}=await db.from("wishlist").delete().eq("id",id).eq("user_id",user.id);
  if(error){button.disabled=false;button.textContent="Try again";statusBox.hidden=false;statusBox.textContent="We couldn't remove that saved item. Please try again.";return;}
  await loadWishlist();
});
loadWishlist();
</script>

<script src="assets/davimart-navigation.js" defer></script>
</body>
</html>
